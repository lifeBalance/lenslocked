services:
  db:
    # Override with:
    # docker-compose 
    # -f docker-compose.yml
    # -f docker-compose.<override>.yml 
    # <up/down/etc> <flags>
    ports:
      - 5433:5432 # <our_machine>:<container>
    volumes:
      -  pgdata:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
  
  adminer:
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula # Not working in 5.4.1; bug in Docker image
    ports:
      - 3333:8080 # <our_machine>:<container>

volumes:
  pgdata: {}